# Verdicts the toy project allows (a subset of the full vocabulary).
version: 1
verdicts:
  term:
    keep:
      label: Keep as is
      terminal: true
      writes: none
    edit_description:
      label: Edit description
      terminal: true
      writes: src
      operation:
        required:
          description: str
    rename:
      label: Rename (id unchanged)
      terminal: true
      writes: src+refs
      operation:
        required:
          label: str
    merge:
      label: Merge into another term
      terminal: true
      writes: src+refs
      operation:
        required:
          into: sid:term
          mappings: choice:move|drop
    delete:
      label: Delete
      terminal: true
      writes: src+refs
    adopt_mapping:
      label: Adopt mapping
      terminal: true
      writes: sssom
      operation:
        required:
          predicate: str
          object: str
        optional:
          object_label: str
          element_type_fit: choice:exact|broad|approximate|not_applicable
          comment: str
    reject_mapping:
      label: Reject mapping
      terminal: true
      writes: sssom
      operation:
        required:
          predicate: str
          object: str
        optional:
          object_label: str
          comment: str
    defer:
      label: Defer
      terminal: false
      writes: none
  enum:
    keep:
      label: Keep as is
      terminal: true
      writes: none
    edit_description:
      label: Edit description
      terminal: true
      writes: src
      operation:
        required:
          description: str
    add_term:
      label: Add a term
      terminal: true
      writes: src
      operation:
        required:
          label: str
        optional:
          description: str
          subsets: sids:subset
    rename_enum:
      label: Rename enum
      terminal: true
      writes: src+refs
      operation:
        required:
          name: str
    delete_enum:
      label: Delete enum
      terminal: true
      writes: src
    defer:
      label: Defer
      terminal: false
      writes: none
  class:
    keep:
      label: Keep as is
      terminal: true
      writes: none
    edit_description:
      label: Edit description
      terminal: true
      writes: src
      operation:
        required:
          description: str
    rename_class:
      label: Rename class
      terminal: true
      writes: src+refs
      operation:
        required:
          name: str
    add_slot:
      label: Add a slot
      terminal: true
      writes: src
      operation:
        optional:
          slot: sid:slot
          new_slot: map
        one_of:
        - - slot
        - - new_slot
    drop_slot:
      label: Drop a slot
      terminal: true
      writes: src
      operation:
        required:
          slot: sid:slot
        optional:
          delete_def: bool
    adopt_mapping:
      label: Adopt mapping
      terminal: true
      writes: src
      operation:
        required:
          predicate: choice:exact_mappings|close_mappings|broad_mappings|narrow_mappings|related_mappings
          object: str
    defer:
      label: Defer
      terminal: false
      writes: none
  slot:
    keep:
      label: Keep as is
      terminal: true
      writes: none
    edit_description:
      label: Edit description
      terminal: true
      writes: src
      operation:
        required:
          description: str
    rename_slot:
      label: Rename slot
      terminal: true
      writes: src+refs
      operation:
        required:
          name: str
    set_cardinality:
      label: Set required / recommended / multivalued
      terminal: true
      writes: src
      operation:
        optional:
          required: bool
          recommended: bool
          multivalued: bool
        one_of:
        - - required
          - recommended
          - multivalued
    set_examples:
      label: Set examples
      terminal: true
      writes: src
      operation:
        required:
          examples: list
    delete_slot:
      label: Delete slot
      terminal: true
      writes: src+refs
    defer:
      label: Defer
      terminal: false
      writes: none
  module:
    keep:
      label: Keep as is
      terminal: true
      writes: none
    edit_description:
      label: Edit description
      terminal: true
      writes: src
      operation:
        required:
          description: str
    defer:
      label: Defer
      terminal: false
      writes: none
  usage:
    keep:
      label: Keep as is
      terminal: true
      writes: none
    defer:
      label: Defer
      terminal: false
      writes: none
  subset:
    keep:
      label: Keep as is
      terminal: true
      writes: none
    defer:
      label: Defer
      terminal: false
      writes: none
